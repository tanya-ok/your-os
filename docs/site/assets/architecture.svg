<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Personal OS local architecture</title><desc id="desc">Browser HTTP and read-only MCP stdio share local libraries. Main Vault supports bounded previewed writes. Two model vaults supply selected read-only context. Local SQLite stores domain state and FTS retrieval. External services require explicit user actions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4z" fill="#63838b"/></marker></defs><rect width="1000" height="640" rx="24" fill="#f1f5f4"/><rect x="24" y="22" width="952" height="500" rx="18" fill="#fff" stroke="#d2e2e3"/><g font-family="system-ui,sans-serif" fill="#334f5b"><text x="48" y="57" font-size="15" letter-spacing="2">ON YOUR COMPUTER</text><rect x="50" y="86" width="285" height="82" rx="14" fill="#e5eff1"/><text x="76" y="119" font-size="21" font-weight="600">Browser workspace</text><text x="76" y="145" font-size="15">HTTP · loopback · inspected actions</text><rect x="665" y="86" width="285" height="82" rx="14" fill="#e5eff1"/><text x="691" y="119" font-size="21" font-weight="600">Your MCP client</text><text x="691" y="145" font-size="15">stdio · selected read-only tools</text><rect x="290" y="220" width="420" height="98" rx="14" fill="#d5e8e7"/><text x="318" y="254" font-size="22" font-weight="600">Shared local libraries</text><text x="318" y="281" font-size="15">Scoped parser · writer · agent context · FTS5</text><text x="318" y="303" font-size="14">Preview + freshness check before Markdown writes</text><g fill="#f1f4ef" stroke="#d2ddd4"><rect x="50" y="372" width="210" height="116" rx="12"/><rect x="280" y="372" width="210" height="116" rx="12"/><rect x="510" y="372" width="210" height="116" rx="12"/><rect x="740" y="372" width="210" height="116" rx="12"/></g><text x="68" y="407" font-size="19" font-weight="600">Main Vault</text><text x="68" y="435" font-size="14">Tasks · projects · Inbox</text><text x="68" y="459" font-size="14">Scoped optional writes</text><text x="298" y="407" font-size="18" font-weight="600">Person-self-model</text><text x="298" y="435" font-size="14">Your chosen guidance</text><text x="298" y="459" font-size="14">Selected read-only notes</text><text x="528" y="407" font-size="19" font-weight="600">AI-Model</text><text x="528" y="435" font-size="14">Your agent's instructions</text><text x="528" y="459" font-size="14">Selected read-only notes</text><text x="758" y="407" font-size="19" font-weight="600">Local SQLite</text><text x="758" y="435" font-size="14">Authoritative page state</text><text x="758" y="459" font-size="14">Sources · logs · FTS index</text><rect x="180" y="556" width="640" height="60" rx="14" fill="#e9e7dd"/><text x="207" y="581" font-size="18" font-weight="600">Explicit connections</text><text x="207" y="603" font-size="14">Approved AI sends · refreshed feeds · optional native Apple permissions</text></g><g stroke="#63838b" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M192 169v26h180v23"/><path d="M807 169v26H628v23"/><path d="M342 319v26H155v26"/><path d="M425 319v26h-40v26"/><path d="M575 319v26h40v26"/><path d="M658 319v26h187v26"/><path d="M950 270h24v255H500v29" stroke-dasharray="5 5"/></g></svg>