<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc"><title id="title">Freshness-aware Markdown mutations</title><desc id="desc">Inspect a preview, check the source, then apply atomically. Changed source stops with conflict 409. Undo requires another freshness check.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="m0 0 7 3.5-7 3.5z" fill="#63838b"/></marker></defs><rect width="1000" height="310" rx="24" fill="#f1f5f4"/><g font-family="system-ui,sans-serif" fill="#334f5b"><text x="32" y="43" font-size="15" letter-spacing="2">A SMALL CHANGE, WITH A VISIBLE BOUNDARY</text><g fill="#fff" stroke="#cadcde"><rect x="32" y="83" width="190" height="94" rx="14"/><rect x="280" y="83" width="190" height="94" rx="14"/><rect x="528" y="83" width="190" height="94" rx="14"/><rect x="776" y="83" width="190" height="94" rx="14"/></g><text x="52" y="119" font-size="21" font-weight="600">1. Preview</text><text x="52" y="149" font-size="14">Inspect the exact change</text><text x="300" y="119" font-size="21" font-weight="600">2. Check</text><text x="300" y="149" font-size="14">Expected source is fresh</text><text x="548" y="119" font-size="21" font-weight="600">3. Apply</text><text x="548" y="149" font-size="14">Temporary file + rename</text><text x="796" y="119" font-size="21" font-weight="600">4. Undo</text><text x="796" y="149" font-size="14">Check freshness again</text><rect x="280" y="222" width="438" height="57" rx="12" fill="#ede7dc"/><text x="302" y="247" font-size="17" font-weight="600">409 · source changed</text><text x="302" y="268" font-size="14">Refresh and prepare a new preview; preserve the newer edit.</text></g><g stroke="#63838b" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M223 130h54"/><path d="M471 130h54"/><path d="M719 130h54"/><path d="M375 178v40"/><path d="M871 178v26H625v15"/></g></svg>